<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preemallery Studio - ระบบจัดการคิวงาน</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-[#FFFDF9] text-[#5A524C] min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-[#F3EFEA] mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-semibold text-[#7C6F64]">✨ ระบบจัดการคิวงาน</h1>
                <p class="text-sm text-[#9E948A]">Preemallery Studio Queue Management</p>
            </div>
            <button onclick="openModal()" class="bg-[#E8C5C8] hover:bg-[#DFB3B6] text-white px-5 py-2.5 rounded-full text-sm font-medium transition-all shadow-sm">
                + เพิ่มคิวงานใหม่
            </button>
        </div>

        <!-- Queue Cards / Table Container -->
        <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 shadow-sm border border-[#F3EFEA]">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-medium text-[#7C6F64]">📋 รายการคิวทั้งหมด</h2>
                <span id="total-count" class="text-xs bg-[#F7F2EC] px-3 py-1 rounded-full text-[#8C8278]">0 คิว</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-[#F3EFEA] text-xs text-[#9E948A]">
                            <th class="py-3 px-4 font-medium">ออเดอร์</th>
                            <th class="py-3 px-4 font-medium">ลูกค้า</th>
                            <th class="py-3 px-4 font-medium">ชิ้นงาน</th>
                            <th class="py-3 px-4 font-medium">ราคา (บาท)</th>
                            <th class="py-3 px-4 font-medium">มัดจำ/รับแล้ว</th>
                            <th class="py-3 px-4 font-medium">กำหนดส่ง</th>
                            <th class="py-3 px-4 font-medium">สถานะ</th>
                            <th class="py-3 px-4 font-medium text-right">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="queue-list" class="text-sm">
                        <!-- Data will be injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal เพิ่ม/แก้ไขงาน -->
    <div id="jobModal" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-lg border border-[#F3EFEA]">
            <h3 id="modal-title" class="text-lg font-medium text-[#7C6F64] mb-4">✨ เพิ่มคิวงานใหม่</h3>
            <form id="jobForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="jobId">
                <div>
                    <label class="block text-xs text-[#8C8278] mb-1">ชื่อลูกค้า / แบรนด์</label>
                    <input type="text" id="clientName" required class="w-full px-4 py-2 rounded-xl border border-[#EFECE6] focus:outline-none focus:border-[#E8C5C8] text-sm">
                </div>
                <div>
                    <label class="block text-xs text-[#8C8278] mb-1">รายละเอียดงาน</label>
                    <input type="text" id="jobTitle" required class="w-full px-4 py-2 rounded-xl border border-[#EFECE6] focus:outline-none focus:border-[#E8C5C8] text-sm">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-[#8C8278] mb-1">ราคาเต็ม (บาท)</label>
                        <input type="number" id="price" value="0" class="w-full px-4 py-2 rounded-xl border border-[#EFECE6] focus:outline-none focus:border-[#E8C5C8] text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-[#8C8278] mb-1">รับเงินแล้ว/มัดจำ (บาท)</label>
                        <input type="number" id="paid" value="0" class="w-full px-4 py-2 rounded-xl border border-[#EFECE6] focus:outline-none focus:border-[#E8C5C8] text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs text-[#8C8278] mb-1">กำหนดส่ง</label>
                        <input type="date" id="deadline" class="w-full px-4 py-2 rounded-xl border border-[#EFECE6] focus:outline-none focus:border-[#E8C5C8] text-sm">
                    </div>
                    <div>
                        <label class="block text-xs text-[#8C8278] mb-1">สถานะ</label>
                        <select id="status" class="w-full px-4 py-2 rounded-xl border border-[#EFECE6] focus:outline-none focus:border-[#E8C5C8] text-sm bg-white">
                            <option value="รอคิว">รอคิว</option>
                            <option value="กำลังทำ">กำลังทำ</option>
                            <option value="เสร็จสิ้น">เสร็จสิ้น</option>
                            <option value="ยกเลิก">ยกเลิก</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-full text-xs text-[#8C8278] hover:bg-[#F7F2EC] transition-all">ยกเลิก</button>
                    <button type="submit" class="bg-[#E8C5C8] hover:bg-[#DFB3B6] text-white px-5 py-2 rounded-full text-xs font-medium transition-all">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal แสดงข้อความสรุปสำหรับส่งลูกค้า -->
    <div id="summaryModal" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden justify-center items-center p-4 z-50">
        <div class="bg-white rounded-3xl p-6 w-full max-w-md shadow-lg border border-[#F3EFEA]">
            <h3 class="text-lg font-medium text-[#7C6F64] mb-2">💬 สรุปคิวงานสำหรับส่งลูกค้า</h3>
            <p class="text-xs text-[#9E948A] mb-3">สามารถกดปุ่มด้านล่างเพื่อคัดลอกข้อความไปวางใน LINE หรือแชทได้เลยค่ะ</p>
            <textarea id="summaryText" readonly class="w-full h-52 p-3 rounded-xl border border-[#EFECE6] bg-[#FFFDF9] text-sm text-[#5A524C] focus:outline-none resize-none mb-4"></textarea>
            <div class="flex justify-end gap-2">
                <button type="button" onclick="closeSummaryModal()" class="px-4 py-2 rounded-full text-xs text-[#8C8278] hover:bg-[#F7F2EC] transition-all">ปิด</button>
                <button type="button" onclick="copySummary()" class="bg-[#E8C5C8] hover:bg-[#DFB3B6] text-white px-5 py-2 rounded-full text-xs font-medium transition-all shadow-sm">คัดลอกข้อความ</button>
            </div>
        </div>
    </div>

    <!-- Script เชื่อมต่อ Supabase และจัดการ Logic -->
    <script>
        // ตั้งค่า Supabase Client
        const SUPABASE_URL = 'https://zlumthwpdgcnyvigygyu.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7lEXqG9AhC_hSSAVhUMViw_qDM84Giu';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allQueuesData = [];

        document.addEventListener('DOMContentLoaded', fetchQueues);

        async function fetchQueues() {
            const { data, error } = await supabase
                .from('freelance_queues')
                .select('*')
                .order('created_at', { ascending: true }); // เรียงจากเก่าไปใหม่ เพื่อให้รันเลข PMS-001 ตามลำดับเวลา

            if (error) {
                console.error('Error fetching data:', error);
                return;
            }

            allQueuesData = data;
            renderQueues(data);
        }

        function renderQueues(queues) {
            const listEl = document.getElementById('queue-list');
            document.getElementById('total-count').innerText = `${queues.length} คิว`;
            
            if (queues.length === 0) {
                listEl.innerHTML = `<tr><td colspan="8" class="text-center py-6 text-xs text-[#9E948A]">ยังไม่มีคิวงานในระบบ</td></tr>`;
                return;
            }

            // แปลงข้อมูลพร้อมใส่เลขออเดอร์แบบ PMS-001 ตามลำดับ
            const formattedQueues = queues.map((q, index) => {
                const orderNumber = `PMS-${String(index + 1).padStart(3, '0')}`;
                return { ...q, orderNumber };
            });

            // กลับด้านให้รายการล่าสุดขึ้นมาแสดงด้านบนสุดของตาราง
            const displayQueues = [...formattedQueues].reverse();

            listEl.innerHTML = displayQueues.map(q => {
                let badgeColor = 'bg-yellow-50 text-yellow-600';
                if (q.status === 'กำลังทำ') badgeColor = 'bg-blue-50 text-blue-600';
                if (q.status === 'เสร็จสิ้น') badgeColor = 'bg-emerald-50 text-emerald-600';
                if (q.status === 'ยกเลิก') badgeColor = 'bg-gray-50 text-gray-400';

                const paidAmount = q.paid || 0;

                return `
                    <tr class="border-b border-[#F7F2EC] hover:bg-[#FFFDFB] transition-all">
                        <td class="py-3 px-4 font-medium text-[#7C6F64]">${q.orderNumber}</td>
                        <td class="py-3 px-4 font-medium text-[#7C6F64]">${q.client_name}</td>
                        <td class="py-3 px-4 text-[#8C8278]">${q.job_title}</td>
                        <td class="py-3 px-4 text-[#8C8278]">${Number(q.price).toLocaleString()} ฿</td>
                        <td class="py-3 px-4 text-[#8C8278]">${Number(paidAmount).toLocaleString()} ฿</td>
                        <td class="py-3 px-4 text-xs text-[#9E948A]">${q.deadline || '-'}</td>
                        <td class="py-3 px-4"><span class="px-2.5 py-1 rounded-full text-xs font-medium ${badgeColor}">${q.status}</span></td>
                        <td class="py-3 px-4 text-right space-x-2">
                            <button onclick="openSummary('${q.id}')" class="text-xs text-pink-400 hover:text-pink-600 font-medium">สรุปส่งลูกค้า</button>
                            <button onclick="editJob('${q.id}')" class="text-xs text-[#8C8278] hover:text-[#7C6F64]">แก้ไข</button>
                            <button onclick="deleteJob('${q.id}')" class="text-xs text-red-400 hover:text-red-600">ลบ</button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function openModal() {
            document.getElementById('jobModal').classList.remove('hidden');
            document.getElementById('jobModal').classList.add('flex');
            document.getElementById('jobForm').reset();
            document.getElementById('jobId').value = '';
            document.getElementById('modal-title').innerText = '✨ เพิ่มคิวงานใหม่';
        }

        function closeModal() {
            document.getElementById('jobModal').classList.remove('flex');
            document.getElementById('jobModal').classList.add('hidden');
        }

        function editJob(id) {
            const q = allQueuesData.find(item => item.id === id);
            if (!q) return;

            document.getElementById('jobId').value = q.id;
            document.getElementById('clientName').value = q.client_name;
            document.getElementById('jobTitle').value = q.job_title;
            document.getElementById('price').value = q.price || 0;
            document.getElementById('paid').value = q.paid || 0;
            document.getElementById('deadline').value = q.deadline === 'null' || !q.deadline ? '' : q.deadline;
            document.getElementById('status').value = q.status;
            
            document.getElementById('modal-title').innerText = '✏️ แก้ไขคิวงาน';
            document.getElementById('jobModal').classList.remove('hidden');
            document.getElementById('jobModal').classList.add('flex');
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('jobId').value;
            const client_name = document.getElementById('clientName').value;
            const job_title = document.getElementById('jobTitle').value;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const paid = parseFloat(document.getElementById('paid').value) || 0;
            const deadline = document.getElementById('deadline').value || null;
            const status = document.getElementById('status').value;

            if (id) {
                const { error } = await supabase
                    .from('freelance_queues')
                    .update({ client_name, job_title, price, paid, deadline, status })
                    .eq('id', id);
                if (error) alert('เกิดข้อผิดพลาด: ' + error.message);
            } else {
                const { error } = await supabase
                    .from('freelance_queues')
                    .insert([{ client_name, job_title, price, paid, deadline, status }]);
                if (error) alert('เกิดข้อผิดพลาด: ' + error.message);
            }

            closeModal();
            fetchQueues();
        }

        async function deleteJob(id) {
            if (confirm('คุณต้องการลบคิวงานนี้ใช่หรือไม่?')) {
                const { error } = await supabase
                    .from('freelance_queues')
                    .delete()
                    .eq('id', id);
                
                if (error) alert('เกิดข้อผิดพลาด: ' + error.message);
                else fetchQueues();
            }
        }

        function openSummary(id) {
            const qIndex = allQueuesData.findIndex(item => item.id === id);
            if (qIndex === -1) return;
            const q = allQueuesData[qIndex];

            const orderNo = `PMS-${String(qIndex + 1).padStart(3, '0')}`;
            const createdDate = q.created_at ? new Date(q.created_at).toISOString().split('T')[0] : '-';
            const deadlineDate = q.deadline || '-';
            const totalPrice = Number(q.price || 0);
            const paidAmount = Number(q.paid || 0);
            const remaining = Math.max(0, totalPrice - paidAmount);

            const text = `🌸 สรุปรายละเอียดคิวงานของคุณ (${q.client_name}) 🌸
-----------------
📌 เลขออเดอร์: #${orderNo}
💻 งาน: ${q.job_title}
📅 วันที่สั่งงาน: ${createdDate}
⏰ กำหนดส่งงาน: ${deadlineDate}
-----------------
💰 ยอดรวม: ${totalPrice.toLocaleString()} บาท
💳 รับเงินแล้ว: ${paidAmount.toLocaleString()} บาท
💵 ยอดคงเหลือชำระวันส่งงาน: ${remaining.toLocaleString()} บาท
-----------------
✨ ขอบคุณที่ใช้บริการค่ะ 🙏🏻💕`;

            document.getElementById('summaryText').value = text;
            document.getElementById('summaryModal').classList.remove('hidden');
            document.getElementById('summaryModal').classList.add('flex');
        }

        function closeSummaryModal() {
            document.getElementById('summaryModal').classList.remove('flex');
            document.getElementById('summaryModal').classList.add('hidden');
        }

        function copySummary() {
            const textarea = document.getElementById('summaryText');
            textarea.select();
            document.execCommand('copy');
            alert('คัดลอกข้อความสรุปคิวงานเรียบร้อยแล้วค่ะ! ✨');
        }
    </script>
</body>
</html>
